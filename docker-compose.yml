services:
  desk:
    build: .
    restart: unless-stopped
    # Bind to the host's loopback only. Reach it with an SSH tunnel:
    #   ssh -N -L 8787:127.0.0.1:8787 you@desk-host
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
    environment:
      # Required: the container binds 0.0.0.0 in its own namespace and
      # server.py refuses that without a token. Set it in .env.
      - STABLEBOT_DESK_TOKEN=${STABLEBOT_DESK_TOKEN:?set STABLEBOT_DESK_TOKEN in .env (openssl rand -hex 24)}
    # Only the lock sleeves. Spot-Lag and Kalshi Lag measured flat-to-negative
    # in BACKTEST_JAN_SEP_2026.md; running them here would only add noise to
    # the ledger expectancy.py scores. kalshi_lock cannot fire, so this is
    # poly_lock alone.
    command: ["stablebot", "desk", "--headless", "--sleeves", "locks", "--serve", "0.0.0.0:8787"]
    stop_grace_period: 30s

  # Passive-quoting forward test (scripts/bt/maker_wx_*). Records books and
  # prints only; no orders. Needs an always-on host: on a laptop that sleeps,
  # 87% of the first 28 h had no book snapshots (see DEPLOY.md).
  maker-wx-poll:
    build: .
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/bt/maker_wx_poll.py"]
    # The image's HEALTHCHECK probes the desk's :8787; the poller serves nothing.
    healthcheck:
      disable: true
    stop_grace_period: 10s
