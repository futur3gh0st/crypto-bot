[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stablebot"
version = "0.1.0"
description = "Paper-trading research bot for stablecoin cross-venue and cross-pair spreads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16"]
poly-live = ["py-clob-client-v2"]

[project.scripts]
stablebot = "stablebot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
extend-exclude = ["scripts/bt/superseded"]

[tool.ruff.lint]
# Deliberately narrow. The full default set flags 410 things here, 130 of them
# `datetime.UTC` vs `timezone.utc` and 54 import ordering -- churn that would
# bury anything real. This set is the subset that catches bugs:
#   F    undefined names, unused imports, dead locals
#   E9   syntax / IO errors
#   B    bugbear: closure-over-loop-variable, silent zip truncation
#   DTZ  naive datetimes -- this system decides whether a market has settled
#   PLE  pylint errors only, no style
select = ["F", "E9", "B", "DTZ", "PLE"]

[tool.ruff.lint.per-file-ignores]
# Research scripts print exploratory tables; unused loop vars there are noise,
# not defects. The live desk under src/ is held to the full set.
"scripts/**" = ["B007"]
